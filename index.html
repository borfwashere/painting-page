<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canaem Briceño</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hero.css">
</head>
<body>
    <div class="hero">
        <picture>
            <source media="(max-width: 639px)" srcset="principal/Aneurisma.jpg">
            <img src="principal/la herida.jpg" alt="" class="hero-image">
        </picture>
        <div class="hero-overlay"></div>
        <header class="hero-header">
            <a href="index.html" class="hero-name">Canaem Briceño</a>

            <div id="mobileNav">
                <nav id="mobile-navigation">
                    <div id="mobile-navigation-label"></div>
                    <ul data-content-field="navigation-mobileNav">
                        <li class="folder">
                            <button class="folder-toggle">Exhibition</button>
                            <ul id="mobile-exhibition-list" class="folder-child"></ul>
                        </li>
                        <li class="folder">
                            <button class="folder-toggle">Work</button>
                            <ul id="mobile-work-list" class="folder-child"></ul>
                        </li>
                    </ul>
                </nav>
            </div>

            <nav class="main-nav dropdown-hover">
                <ul id="nav" data-content-field="navigation-mainNav">
                    <li class="folders-collection folder">
                        <a>Exhibition</a>
                        <div class="subnav">
                            <ul id="main-exhibition-list"></ul>
                        </div>
                    </li>
                    <li class="folders-collection folder">
                        <a>Work</a>
                        <div class="subnav">
                            <ul id="main-work-list"></ul>
                        </div>
                    </li>
                </ul>
            </nav>
        </header>
    </div>

    <script src="data/exhibitions.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/year-data.js?v=2"></script>
    <script>
        populateExhibitionDropdown();
        initMobileNav();
        initFolderToggles();
        initDesktopNavTap();
    </script>
</body>
</html>
